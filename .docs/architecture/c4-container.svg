<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="Segoe UI, Arial, sans-serif">
  <title>C4 Level 2 - Containers: Survey Contour Generator</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="900" height="480" rx="10" fill="#111827"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#f1f5f9">C4 Level 2 - Containers</text>
  <text x="24" y="54" font-size="12" fill="#94a3b8">One Dart codebase, three build targets</text>

  <rect x="330" y="70" width="240" height="56" rx="10" fill="#334155" stroke="#94a3b8"/>
  <text x="450" y="94" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Surveyor</text>
  <text x="450" y="112" font-size="12" fill="#cbd5e1" text-anchor="middle">[Person]</text>

  <!-- three targets -->
  <rect x="40" y="190" width="240" height="120" rx="10" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="160" y="220" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Android app</text>
  <text x="160" y="240" font-size="12" fill="#dbeafe" text-anchor="middle">[Flutter, AAB/APK]</text>
  <text x="160" y="264" font-size="12" fill="#e0e7ff" text-anchor="middle">No INTERNET permission,</text>
  <text x="160" y="282" font-size="12" fill="#e0e7ff" text-anchor="middle">no backup, isolates</text>

  <rect x="330" y="190" width="240" height="120" rx="10" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="450" y="220" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Web PWA</text>
  <text x="450" y="240" font-size="12" fill="#dbeafe" text-anchor="middle">[Flutter Wasm + CanvasKit]</text>
  <text x="450" y="264" font-size="12" fill="#e0e7ff" text-anchor="middle">Installable, runs offline,</text>
  <text x="450" y="282" font-size="12" fill="#e0e7ff" text-anchor="middle">inline compute (no isolates)</text>

  <rect x="620" y="190" width="240" height="120" rx="10" fill="#1d4ed8" stroke="#93c5fd"/>
  <text x="740" y="220" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Windows app</text>
  <text x="740" y="240" font-size="12" fill="#dbeafe" text-anchor="middle">[Flutter, desktop]</text>
  <text x="740" y="264" font-size="12" fill="#e0e7ff" text-anchor="middle">Native file dialogs,</text>
  <text x="740" y="282" font-size="12" fill="#e0e7ff" text-anchor="middle">isolates</text>

  <!-- service worker -->
  <rect x="330" y="340" width="240" height="64" rx="10" fill="#0f766e" stroke="#5eead4"/>
  <text x="450" y="366" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Service worker (sw.js)</text>
  <text x="450" y="386" font-size="12" fill="#ccfbf1" text-anchor="middle">[JavaScript] precache + offline cache</text>

  <!-- shared -->
  <rect x="40" y="425" width="820" height="40" rx="8" fill="#475569" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="450" y="450" font-size="13" fill="#f8fafc" text-anchor="middle">Shared Dart codebase: domain (pure Dart) + data + presentation + core/platform ports</text>

  <!-- arrows -->
  <line x1="400" y1="126" x2="190" y2="188" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="126" x2="450" y2="188" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="126" x2="710" y2="188" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="450" y1="312" x2="450" y2="338" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="460" y="330" font-size="11" fill="#e2e8f0">registers</text>
  <text x="20" y="150" font-size="11" fill="#e2e8f0">uses</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Arial, sans-serif">
  <title>C4 Level 1 - System context: Survey Contour Generator</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"/>
    </marker>
  </defs>
  <rect width="900" height="460" rx="10" fill="#111827"/>
  <text x="24" y="34" font-size="18" font-weight="bold" fill="#f1f5f9">C4 Level 1 - System context</text>
  <text x="24" y="54" font-size="12" fill="#94a3b8">Survey Contour Generator (Flutter: Android, Web PWA, Windows)</text>

  <!-- person -->
  <rect x="40" y="170" width="200" height="110" rx="10" fill="#334155" stroke="#94a3b8"/>
  <text x="140" y="212" font-size="15" font-weight="bold" fill="#f8fafc" text-anchor="middle">Surveyor / Civil engineer</text>
  <text x="140" y="234" font-size="12" fill="#cbd5e1" text-anchor="middle">[Person]</text>
  <text x="140" y="254" font-size="12" fill="#cbd5e1" text-anchor="middle">Builds contour maps</text>

  <!-- system -->
  <rect x="340" y="150" width="230" height="150" rx="10" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>
  <text x="455" y="195" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">ContourGen app</text>
  <text x="455" y="217" font-size="12" fill="#dbeafe" text-anchor="middle">[Software system]</text>
  <text x="455" y="243" font-size="12" fill="#e0e7ff" text-anchor="middle">Imports points, builds TIN,</text>
  <text x="455" y="261" font-size="12" fill="#e0e7ff" text-anchor="middle">draws contours, analyses terrain,</text>
  <text x="455" y="279" font-size="12" fill="#e0e7ff" text-anchor="middle">exports files. Works offline.</text>

  <!-- spreadsheet -->
  <rect x="660" y="70" width="210" height="100" rx="10" fill="#475569" stroke="#94a3b8"/>
  <text x="765" y="106" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">Survey spreadsheet</text>
  <text x="765" y="126" font-size="12" fill="#e2e8f0" text-anchor="middle">[External file, .xlsx]</text>
  <text x="765" y="146" font-size="12" fill="#e2e8f0" text-anchor="middle">X, Y, RL, borehole, line</text>

  <!-- CAD -->
  <rect x="660" y="260" width="210" height="130" rx="10" fill="#475569" stroke="#94a3b8"/>
  <text x="765" y="296" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">AutoCAD / Civil 3D</text>
  <text x="765" y="316" font-size="12" fill="#e2e8f0" text-anchor="middle">[External software]</text>
  <text x="765" y="338" font-size="12" fill="#e2e8f0" text-anchor="middle">Opens exported files:</text>
  <text x="765" y="356" font-size="12" fill="#e2e8f0" text-anchor="middle">.dxf .lsp .scr</text>

  <!-- arrows -->
  <line x1="240" y1="225" x2="338" y2="225" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="289" y="215" font-size="11" fill="#e2e8f0" text-anchor="middle">uses</text>

  <line x1="660" y1="140" x2="572" y2="185" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="188" font-size="11" fill="#e2e8f0" text-anchor="end">imports points</text>

  <line x1="570" y1="265" x2="658" y2="300" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="296" font-size="11" fill="#e2e8f0">exports files</text>

  <line x1="765" y1="170" x2="765" y2="258" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="775" y="218" font-size="11" fill="#94a3b8">(no direct link;</text>
  <text x="775" y="232" font-size="11" fill="#94a3b8">file hand-off only)</text>

  <text x="24" y="440" font-size="11" fill="#94a3b8">No network services: the app runs locally and exchanges data only through files.</text>
</svg>

  <style>
    html, body { margin: 0; height: 100%; background: #0a0e14; color: #e8eaed; overflow: hidden; }
    #boot {
      position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; gap: 12px;
      background: #0a0e14; font-family: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      transition: opacity .2s ease;
    }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .logo-icon {
      width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #00d9ff, #a855f7);
      animation: boot-pulse 1.4s ease-in-out infinite;
    }
    #boot .logo-text { font-weight: 600; font-size: 20px; }
    #boot .logo-text span { color: #00d9ff; }
    @keyframes boot-pulse { 0%, 100% { box-shadow: 0 0 0 rgba(0, 217, 255, 0); } 50% { box-shadow: 0 0 24px rgba(0, 217, 255, .45); } }
    @media (prefers-reduced-motion: reduce) { #boot .logo-icon { animation: none; } }
  </style>
